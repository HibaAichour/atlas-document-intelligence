# Nginx configuration for the ATLAS frontend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend service defined in docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload size limit (Nginx default: 1 MB). Set slightly above the
        # backend limit (MAX_UPLOAD_MB = 20), so the backend is the one that
        # rejects oversized files, with a clear JSON error. Multipart encoding
        # adds a little overhead on top of the file size.
        client_max_body_size 21m;

        # Ingestion is synchronous in V1: OCR on a scanned PDF can take a
        # while before the backend answers (Nginx default: 60 s).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Single-page application: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}