# Run the backend and frontend checks on every push and pull request to main.
# No API key is involved: the tests never call Groq, Gemini or Ollama.

name: Tests

on:
  push:
    branches: [main]
    # Documentation only: nothing to test. eval/ is not ignored, because the
    # backend tests read eval/questions.json.
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  # "Run workflow" button in the Actions tab, to run the checks without a commit.
  workflow_dispatch:

# A newer push on the same branch cancels the checks of an older one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the checks only read the code.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Same minor version as the production image.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Tesseract (OCR tests are skipped without it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install the dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Type check with mypy (report only, known errors not fixed yet)
        continue-on-error: true
        run: mypy app

      - name: Run the tests
        # -rs lists every skipped test, so a missing tool cannot hide tests.
        run: python -m pytest -q -rs

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Same major version as the image that builds the frontend.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Run the tests
        run: npm test

      - name: Check the types and build
        run: npm run build
